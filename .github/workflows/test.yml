name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            compat/go.sum

      - name: Unit and integration tests
        run: make test

      - name: Coverage gate
        run: make cover-check

      - name: AWS SDK for Go v2 compatibility
        run: make test-compat

      # aws cli v2 is preinstalled on GitHub-hosted Ubuntu runners.
      - name: aws cli end-to-end
        run: make test-awscli

      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone

      - name: rclone end-to-end
        run: make test-rclone
