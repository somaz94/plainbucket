name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            compat/go.sum

      - name: Unit and integration tests
        run: make test

      - name: Coverage gate
        run: make cover-check

      - name: AWS SDK for Go v2 compatibility
        run: make test-compat

      # helm is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Helm chart tests
        run: make test-helm

      # aws cli v2 is preinstalled on GitHub-hosted Ubuntu runners.
      - name: aws cli end-to-end
        run: make test-awscli

      # Pinned release: the Ubuntu package lags behind and lacks --s3-directory-markers.
      - name: Install rclone
        env:
          RCLONE_VERSION: v1.70.2
          RCLONE_SHA256: 7bfa813f426820d20436e48a4e0b9bf21977fcd513a48f2d28eede3136b4bacb
        run: |
          zip="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/${RCLONE_VERSION}/${zip}"
          echo "${RCLONE_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}"
          sudo install -m 0755 "rclone-${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1

      - name: rclone end-to-end
        run: make test-rclone

      # The script pins the gitlab-runner version and checksum; the cache only saves the download.
      - name: Cache gitlab-runner
        uses: actions/cache@v6
        with:
          path: bin/gitlab-runner-*
          key: gitlab-runner-${{ runner.os }}-${{ hashFiles('hack/test-gitlab-runner.sh') }}

      - name: GitLab Runner cache end-to-end
        run: make test-runner

      # node is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Web console end-to-end
        run: make test-console

  s3-tests:
    name: ceph/s3-tests subset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The script pins the s3-tests commit and the frozen requirements; the cache only saves the setup.
      - name: Cache s3-tests
        uses: actions/cache@v6
        with:
          path: |
            bin/s3-tests
            bin/s3tests-venv
          # A venv points at its interpreter, so a new Python patch or image must rebuild it.
          key: s3tests-${{ env.ImageOS }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('hack/test-s3tests.sh', 'hack/s3tests-requirements.txt') }}

      - name: s3-tests
        env:
          S3TESTS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: make test-s3tests

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3tests-report
          path: |
            bin/s3tests.xml
            bin/s3tests.log
          if-no-files-found: ignore
          retention-days: 7
