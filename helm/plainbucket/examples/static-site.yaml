# Static hosting: "www" serves index.html and 404.html to anyone, as www.s3.example.com/
# (wildcard DNS and certificate) or s3.example.com/www/, and lets one origin fetch it.
auth:
  existingSecret: plainbucket-auth
config:
  domains: [s3.example.com]
  buckets:
    www:
      public: true
      website:
        index: index.html
        error: 404.html
      cors:
        allowed-origins: ["https://app.example.com"]
        max-age: 1h
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: s3.example.com
      paths:
        - path: /
          pathType: Prefix
    - host: "*.s3.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: s3-example-com-tls
      hosts:
        - s3.example.com
        - "*.s3.example.com"
