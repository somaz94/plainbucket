# HTTPS in the pod from a kubernetes.io/tls Secret, with Prometheus Operator scraping,
# the chart's alerts and its Grafana dashboard.
auth:
  existingSecret: plainbucket-auth
config:
  tlsSecret: plainbucket-tls
  tlsMinVers: TLS13
  metrics: true
  logFormat: json
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
  tlsConfig:
    insecureSkipVerify: true
prometheusRule:
  enabled: true
  labels:
    release: prometheus
grafanaDashboard:
  enabled: true
