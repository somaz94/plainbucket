{{- if include "plainbucket.configFile" . }}
{{- range $name, $b := .Values.config.buckets }}
{{- range $i, $n := $b.notify }}
{{- $f := toString (index $n "secret-file") }}
{{- if and (hasPrefix "/etc/plainbucket/notify/" $f) (not $.Values.config.notifySecret) }}
{{- fail (printf "config.buckets.%s.notify[%d].secret-file %s needs config.notifySecret: the server would not start without the file" $name $i $f) }}
{{- end }}
{{- end }}
{{- range $i, $r := $b.replicate }}
{{- range $field := list "access-key-file" "secret-key-file" "session-token-file" }}
{{- $f := toString (index $r $field) }}
{{- if and (hasPrefix "/etc/plainbucket/replicate/" $f) (not $.Values.config.replicateSecret) }}
{{- fail (printf "config.buckets.%s.replicate[%d].%s %s needs config.replicateSecret: the server would not start without the file" $name $i $field $f) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plainbucket.fullname" . }}-config
  labels:
    {{- include "plainbucket.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- with .Values.config.buckets }}
    buckets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.config.rateLimit }}
    rate-limit:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.config.anonymousRateLimit }}
    anonymous-rate-limit:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
