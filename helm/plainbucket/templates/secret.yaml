{{- if and (not .Values.auth.existingSecret) .Values.auth.accessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plainbucket.authSecret" . }}
  labels:
    {{- include "plainbucket.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.accessKeyKey }}: {{ .Values.auth.accessKey | b64enc | quote }}
  {{ .Values.auth.secretKeyKey }}: {{ .Values.auth.secretKey | b64enc | quote }}
{{- end }}
