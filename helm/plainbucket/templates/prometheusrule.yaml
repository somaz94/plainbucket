{{- if .Values.prometheusRule.enabled }}
{{- if not .Values.config.metrics }}
{{- fail "prometheusRule.enabled requires config.metrics=true: the alerts read /metrics" }}
{{- end }}
{{- $sel := .Values.prometheusRule.selector | default (printf "job=%q, namespace=%q" (include "plainbucket.fullname" .) .Release.Namespace) }}
{{- $r := .Values.prometheusRule.rules }}
{{- $any := .Values.prometheusRule.additionalRules }}
{{- range $r }}{{ if .enabled }}{{ $any = true }}{{ end }}{{ end }}
{{- if not $any }}
{{- fail "prometheusRule.enabled with every rule disabled and no additionalRules would render an empty group" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "plainbucket.fullname" . }}
  labels:
    {{- include "plainbucket.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: plainbucket
      rules:
        {{- with $r.down }}{{ if .enabled }}
        - alert: PlainbucketDown
          expr: |-
            up{ {{- $sel -}} } == 0 or absent(up{ {{- $sel -}} })
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket is not being scraped as up.
        {{- end }}{{ end }}
        {{- with $r.errors }}{{ if .enabled }}
        - alert: PlainbucketHighErrorRate
          expr: |-
            sum by (namespace, job) (rate(plainbucket_requests_total{ {{- $sel }}, status=~"5..", status!~"501|503|507"}[5m]))
              / sum by (namespace, job) (rate(plainbucket_requests_total{ {{- $sel -}} }[5m])) > {{ .ratio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket answers too many requests with a server error.
            description: {{ printf "%s of requests failed with 5xx (501, 503 and 507 aside) over the last 5 minutes; the server log has the errors." "{{ $value | humanizePercentage }}" | quote }}
        {{- end }}{{ end }}
        {{- with $r.writesRefused }}{{ if .enabled }}
        - alert: PlainbucketWritesRefused
          expr: |-
            sum by (namespace, job) (increase(plainbucket_requests_total{ {{- $sel }}, status="507"}[10m])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket refuses writes for lack of disk space.
            description: Writes were answered 507 InsufficientStorage. Free space on the volume is below config.minFreeSpace, or the volume is full; reads and deletes still work.
        {{- end }}{{ end }}
        {{- with $r.diskLow }}{{ if .enabled }}
        - alert: PlainbucketDiskLow
          expr: |-
            (plainbucket_filesystem_free_bytes{ {{- $sel -}} } - plainbucket_min_free_bytes{ {{- $sel -}} })
              / plainbucket_filesystem_size_bytes{ {{- $sel -}} } < {{ .ratio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket's volume is running out of space.
            description: {{ printf "%s of the volume is left before writes are refused." "{{ $value | humanizePercentage }}" | quote }}
        {{- end }}{{ end }}
        {{- with $r.bucketNearLimit }}{{ if .enabled }}
        - alert: PlainbucketBucketNearLimit
          expr: |-
            plainbucket_bucket_bytes{ {{- $sel -}} }
              / ignoring(evict) plainbucket_bucket_max_size_bytes{ {{- $sel }}, evict="false"} > {{ .ratio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: A plainbucket bucket is close to its max-size.
            description: {{ printf "Bucket %s is %s full; past max-size its writes are refused with 403 QuotaExceeded." "{{ $labels.bucket }}" "{{ $value | humanizePercentage }}" | quote }}
        {{- end }}{{ end }}
        {{- with $r.notificationsFailing }}{{ if .enabled }}
        - alert: PlainbucketNotificationsFailing
          expr: |-
            sum by (namespace, job) (increase(plainbucket_notifications_total{ {{- $sel }}, result=~"failed|dropped"}[10m])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket is losing bucket event notifications.
            description: Webhook deliveries failed after their retries, were refused, or were dropped on a full queue; those events are not sent again. The server log names the webhook and the error.
        {{- end }}{{ end }}
        {{- with $r.corruptObjects }}{{ if .enabled }}
        - alert: PlainbucketCorruptObjects
          expr: |-
            max by (namespace, job) (plainbucket_scrub_corrupt_objects{ {{- $sel -}} }) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket found objects whose data is damaged.
            description: {{ printf "The last scrub found %s objects whose data no longer matches the ETag or checksums recorded when they were written. The server log names them; restore them from a backup." "{{ $value }}" | quote }}
        {{- end }}{{ end }}
        {{- with $r.syncErrors }}{{ if .enabled }}
        - alert: PlainbucketSyncErrors
          expr: |-
            sum by (namespace, job) (increase(plainbucket_sync_errors_total{ {{- $sel -}} }[10m])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: plainbucket cannot flush writes to disk.
            description: Flushing a directory after a write failed, so recent writes may not survive a power loss; the volume may be failing. The server log names the directory and the error.
        {{- end }}{{ end }}
        {{- with .Values.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
